apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-ui
  namespace: argocd
spec: 
  project: default  

  source:
    repoURL: https://github.com/rdill-83/vote-deploy.git 
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc 
    namespace: vote-app
  syncPolicy:
    syncOptions:
      - CreateNamespace: true